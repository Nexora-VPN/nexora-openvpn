name: test

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Ensure TUN device
        run: |
          sudo mkdir -p /dev/net
          if [ ! -e /dev/net/tun ]; then
            sudo mknod /dev/net/tun c 10 200
          fi
          sudo chmod 0666 /dev/net/tun

      - name: Run tests
        run: make test
